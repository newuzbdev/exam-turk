name: Check and deploy to Contabo

on:
  push:
    branches: [main, master, 'codex/live-sync-*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      deploy:
        description: Publish the checked main branch to Contabo
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: contabo-frontend-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VITE_API_URL: "https://api.turkishmock.uz"
      VITE_GOOGLE_CLIENT_ID: "816519766562-6q30ok84uh49jj2eh6d9vbjnmqu0uoti.apps.googleusercontent.com"
      VITE_TELEGRAM_BOT_USERNAME: "turkishmockbot"
      VITE_ADMIN_APP_URL: "https://admin.turkishmock.uz"
      VITE_ADMIN_LAUNCH_FEATURES_ENABLED: "false"
      VITE_LEGAL_DRAFT_PREVIEW: "false"
      VITE_STUDENT_APP_URL: "https://turkishmock.uz"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: python3 deploy/test-contabo-deploy.py
      - run: python3 deploy/test-public-seo.py deploy/nginx.conf "$RUNNER_TEMP/public-seo-tests.json"
      - run: npm run build

  deploy:
    needs: check
    if: >-
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') &&
      (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.deploy))
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Send the checked source to the restricted deployment command
        env:
          CONTABO_DEPLOY_KEY: ${{ secrets.CONTABO_DEPLOY_KEY }}
          CONTABO_KNOWN_HOSTS: ${{ vars.CONTABO_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CONTABO_DEPLOY_KEY"
          test -n "$CONTABO_KNOWN_HOSTS"
          umask 077
          key_file="$RUNNER_TEMP/contabo-deploy.key"
          hosts_file="$RUNNER_TEMP/contabo-known-hosts"
          trap 'rm -f "$key_file" "$hosts_file"' EXIT
          printf '%s\n' "$CONTABO_DEPLOY_KEY" > "$key_file"
          printf '%s\n' "$CONTABO_KNOWN_HOSTS" > "$hosts_file"
          git archive --format=tar.gz "$GITHUB_SHA" | ssh \
            -i "$key_file" -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$hosts_file" \
            -o ConnectTimeout=20 root@195.88.87.174 "deploy $GITHUB_SHA"
