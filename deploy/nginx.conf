# Public student build only. Never log query strings or the Referer header.
log_format access_safe '$remote_addr - $remote_user [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent';
server {
    access_log /var/log/nginx/access.log access_safe;
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    include /etc/nginx/snippets/public-seo-locations.conf;
    include /etc/nginx/snippets/optimized-image-redirects*.conf;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    # Every application route is private to search by default. The exact public
    # homepage locations below opt back into indexing.
    add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet, noimageindex" always;

    # Vite fingerprints identify a new URL whenever JS/CSS contents change.
    location ~ "^/assets/[^/]+-[A-Za-z0-9_-]{8}\.(?:js|css)$" {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        try_files $uri =404;
    }

    # HTML must discover the current build after a deployment.
    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Robots-Tag "index, follow, noarchive, max-image-preview:large, max-snippet:-1, max-video-preview:-1" always;
    }

    # Only versioned PUBLIC card thumbnails can be shared by a CDN.
    location ~ "^/generated/practice-covers-v2/[a-f0-9]{64}-(?:480|960)\.webp$" {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive, noimageindex" always;
        try_files $uri =404;
    }

    # The public brand icon must be crawlable for search results.
    location = /favicon-red.png {
        add_header X-Robots-Tag "index, follow" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    # Stable public brand assets used by homepage metadata and structured data.
    # Exam/practice/user media continues to fall through to the protected rule.
    location = /logo11.svg {
        add_header X-Robots-Tag "index, follow" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    location = /turkishmock-hero-line-people.png {
        add_header X-Robots-Tag "index, follow" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    location ~* \.(?:avif|gif|jpe?g|png|svg|webp|aac|flac|m4a|mp3|mp4|ogg|wav|webm)$ {
        add_header X-Robots-Tag "noindex, nofollow, noarchive, noimageindex" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }
    # Keep SPA fallback responses private to search. A direct /index.html request
    # is public, but an application route must not inherit its indexing header.
    location / { try_files $uri $uri/ @student_app; }
    location @student_app { try_files /index.html =404; }
}
