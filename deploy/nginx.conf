# Included by the image's http context. Query strings and raw Referer are excluded.
log_format access_safe '$remote_addr - $remote_user [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent';
server {
    access_log /var/log/nginx/access.log access_safe;
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Robots-Tag "index, follow, noimageindex, noarchive" always;
    location ~* \.(?:avif|gif|jpe?g|png|svg|webp|aac|flac|m4a|mp3|mp4|ogg|wav|webm)$ {
        add_header X-Robots-Tag "noindex, nofollow, noarchive, noimageindex" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }
    location / { try_files $uri $uri/ /index.html; }
}
