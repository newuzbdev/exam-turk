# Only the three approved, fingerprinted home-page showcase copies are cacheable.
# This fragment is also loaded by the existing production image-config include.
location ~ "^/assets/(?:hakan-birdal|muattar-mamatkarimova|timur-makarov)-[A-Za-z0-9_-]{8}\.webp$" {
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive, noimageindex" always;
    try_files $uri =404;
}
