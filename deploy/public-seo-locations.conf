# Shared by the image config and the server's public frontend config.
# Declare the homepage canonical only on the homepage, never on app/legal pages.
location = / {
    add_header Link '<https://turkishmock.uz/>; rel="canonical"' always;
    add_header Cache-Control "no-cache";
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Robots-Tag "index, follow, noarchive, max-image-preview:large, max-snippet:-1, max-video-preview:-1" always;
    try_files /index.html =404;
}

# These two stable homepage assets are intentionally crawlable. This shared
# snippet is mounted by the live server config, so the exception remains active
# even while the deployment process preserves that protected config file.
location = /logo11.svg {
    add_header X-Robots-Tag "index, follow" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Cache-Control "public, max-age=86400";
    try_files $uri =404;
}

location = /turkishmock-hero-line-people.png {
    add_header X-Robots-Tag "index, follow" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Cache-Control "public, max-age=86400";
    try_files $uri =404;
}

location = /sitemap.xml {
    default_type application/xml;
    try_files $uri =404;
}

location = /robots.txt {
    default_type text/plain;
    try_files $uri =404;
}

# Relative locations keep HTTPS behind the proxy and retain referral queries.
location ~ ^/price/?$ {
    absolute_redirect off;
    return 301 /app/fiyatlar$is_args$args;
}

location ~ ^/test/?$ {
    absolute_redirect off;
    return 301 /app/test$is_args$args;
}

location ~ ^/signup/?$ {
    absolute_redirect off;
    return 301 /login$is_args$args;
}

location ~ ^/how-it-works/?$ {
    absolute_redirect off;
    return 301 /#sss;
}
